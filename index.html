<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a1917;
      --surface: #252320;
      --text: #e8e4dc;
      --muted: #9a948a;
      --accent: #c4b8a0;
      --border: #3a3732;
      --error: #c48a8a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    /* ——— Gate ——— */
    #gate {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 10;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    #gate.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .gate-inner {
      width: min(340px, 90vw);
      text-align: center;
    }

    .gate-label {
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .gate-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 0.25rem;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      color: var(--text);
      text-align: center;
      letter-spacing: 0.12em;
      outline: none;
      transition: border-color 0.25s ease;
    }

    .gate-input:focus {
      border-color: var(--accent);
    }

    .gate-input::placeholder {
      color: var(--muted);
      letter-spacing: 0.08em;
      opacity: 0.7;
    }

    .gate-btn {
      margin-top: 1.75rem;
      background: none;
      border: 1px solid var(--border);
      color: var(--accent);
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.7rem 1.8rem;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .gate-btn:hover {
      background: var(--surface);
      border-color: var(--accent);
      color: var(--text);
    }

    .gate-error {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: var(--error);
      opacity: 0;
      transition: opacity 0.3s ease;
      height: 1.2em;
    }

    .gate-error.show {
      opacity: 1;
    }

    /* ——— Poem ——— */
    #poem {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.9s ease 0.2s, transform 0.9s ease 0.2s;
    }

    #poem.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .poem-container {
      max-width: 520px;
      width: 100%;
    }

    .poem-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.65rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-align: center;
      margin-bottom: 2.5rem;
      color: var(--text);
    }

    .poem-body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.2rem;
      line-height: 1.85;
      font-weight: 400;
      color: var(--text);
      white-space: pre-wrap;
      text-align: left;
    }

    .poem-body em {
      font-style: italic;
    }

    .poem-footer {
      margin-top: 3.5rem;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* subtle divider line above footer */
    .poem-footer::before {
      content: "";
      display: block;
      width: 32px;
      height: 1px;
      background: var(--border);
      margin: 0 auto 1.25rem;
    }

    @media (max-width: 480px) {
      .poem-title {
        font-size: 1.4rem;
      }
      .poem-body {
        font-size: 1.1rem;
        line-height: 1.75;
      }
    }
  </style>
</head>
<body>

  <!-- Code gate -->
  <div id="gate">
    <div class="gate-inner">
      <p class="gate-label">Enter code</p>
      <input
        type="password"
        id="codeInput"
        class="gate-input"
        placeholder="••••••••"
        autocomplete="off"
        autofocus
      />
      <button type="button" class="gate-btn" id="submitBtn">Enter</button>
      <p class="gate-error" id="errorMsg">Incorrect code</p>
    </div>
  </div>

  <!-- Poem page -->
  <main id="poem">
    <div class="poem-container">
      <h1 class="poem-title">Untitled</h1>
      <div class="poem-body" id="poemText"></div>
      <p class="poem-footer">private</p>
    </div>
  </main>

  <script>
    // ──────────────────────────────────────────────
    //  CHANGE THE CODE HERE
    // ──────────────────────────────────────────────
    const ACCESS_CODE = "457143";

    // ──────────────────────────────────────────────
    //  REPLACE THE PLACEHOLDER POEM BELOW
    //  Keep the text inside the backticks (`)
    // ──────────────────────────────────────────────
    const POEM = `
The quiet room holds
what the day could not say.

Light slips across the floor
like a thought that almost stays.

Somewhere a clock forgets
to mark the hour,
and for a moment
everything is enough.
`;

    // ─── logic ───────────────────────────────────
    const gate = document.getElementById("gate");
    const poem = document.getElementById("poem");
    const input = document.getElementById("codeInput");
    const btn = document.getElementById("submitBtn");
    const error = document.getElementById("errorMsg");
    const poemText = document.getElementById("poemText");

    // inject poem (trimmed so leading/trailing blank lines are clean)
    poemText.textContent = POEM.trim();

    function tryUnlock() {
      const entered = input.value.trim();
      if (entered === ACCESS_CODE) {
        error.classList.remove("show");
        gate.classList.add("hidden");
        poem.classList.add("visible");
        // optional: remember for this session
        sessionStorage.setItem("poem_unlocked", "1");
      } else {
        error.classList.add("show");
        input.value = "";
        input.focus();
      }
    }

    btn.addEventListener("click", tryUnlock);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryUnlock();
    });

    // if already unlocked in this browser session, skip the gate
    if (sessionStorage.getItem("poem_unlocked") === "1") {
      gate.classList.add("hidden");
      poem.classList.add("visible");
    }
  </script>
</body>
</html>
